[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tacticalm"
version = "0.1.0"
description = "A Fine-Tuned Football Tactical Analysis Model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "peft",
    "trl",
    "accelerate",
    "bitsandbytes",
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn",
    "pydantic",
    "pyyaml",
    "mlflow",
    "fastapi",
    "uvicorn",
    "streamlit",
    "streamlit-plotly-events",
    "matplotlib",
    "plotly",
    "statsbombpy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "mypy",
    "pre-commit"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
