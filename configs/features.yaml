features:
  pitch_zones:
    defensive_third:
      x_min: 0
      x_max: 40
    middle_third:
      x_min: 40
      x_max: 80
    attacking_third:
      x_min: 80
      x_max: 120
    penalty_area:
      x_min: 102
      x_max: 120
      y_min: 18
      y_max: 62
    
  progressive_pass:
    rule: "Completed forward pass moving ball closer to center of opponent goal"
    min_distance_reduction: 10  # meters (approx 10.94 yards)
    goal_center: [120, 40]
    
  progressive_carry:
    rule: "Carry moving ball closer to center of opponent goal"
    min_distance_reduction: 10
    goal_center: [120, 40]
    
  high_xg_threshold: 0.3
  
  line_breaking_pass:
    requires_360: true
    note: "Only computed when 360 freeze-frame data is available"
    
  pressing:
    high_regain_zone: attacking_third
    ppda_defensive_zone_x_min: 48  # opponent's attacking 60%
    shots_after_regain_seconds: 10
    
  transitions:
    counterattack_play_pattern: "From Counter"
    fast_attack_seconds: 10
    
  players:
    min_minutes_for_analysis: 15
